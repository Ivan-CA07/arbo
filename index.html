<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Navidad Cobroactivo!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a18;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .ui-panel {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      max-width: 96vw;
      background: rgba(10, 16, 30, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .ui-panel.hidden-rec {
      opacity: 0.15;
    }
    .ui-panel.hidden-rec:hover {
      opacity: 1;
    }
    .theme-btn, .action-btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.88);
      padding: 7px 11px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .theme-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.55);
    }
    .action-btn.highlight {
      border-color: rgba(255, 215, 0, 0.45);
      color: #ffe680;
    }
    .action-btn.rec-btn {
      background: rgba(220, 38, 38, 0.25);
      border-color: rgba(248, 113, 113, 0.6);
      color: #fecaca;
    }
    .action-btn.rec-btn.recording {
      background: #dc2626;
      color: #ffffff;
      animation: pulseRec 1s infinite;
    }
    @keyframes pulseRec {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="ui-panel" id="uiPanel">
    <button class="theme-btn active"
            data-theme="imperial">Imperial</button>
    <button class="theme-btn"
            data-theme="cyberpunk">Cyberpunk</button>
    <button class="theme-btn"
            data-theme="aurora">Aurora</button>
    <button class="action-btn highlight"
            id="addLightsBtn">
      💡 + Luces (<span id="lightCount">0</span>)
    </button>
    <button class="action-btn highlight"
            id="elfBtn">🧝 + Duende</button>
    <button class="action-btn"
            id="fireworkBtn">✨ Destello</button>
    <button class="action-btn"
            id="soundBtn">🔊 Sonido</button>
    <button class="action-btn rec-btn"
            id="recordBtn">🎥 Grabar Video</button>
  </div>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Trazos vectoriales exactos del logo Cobroactivo
    const logoPathBlue = new Path2D(
      'M 52 10 C 22 14, 6 42, 14 68 ' +
      'C 19 82, 34 86, 46 82 ' +
      'C 30 78, 22 62, 26 43 ' +
      'C 30 25, 46 15, 68 18 ' +
      'C 63 12, 57 9, 52 10 Z'
    );
    const logoPathGray = new Path2D(
      'M 48 22 C 66 23, 78 38, 76 57 ' +
      'C 74 75, 58 86, 36 82 ' +
      'C 26 80, 19 75, 15 69 ' +
      'C 23 84, 41 91, 59 87 ' +
      'C 81 82, 94 60, 88 39 ' +
      'C 83 24, 66 18, 48 22 Z'
    );
    let audioCtx = null;
    let audioDest = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext ||
                   window.webkitAudioContext;
        audioCtx = new AC();
        audioDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playMagicChime(pitch = 1) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const notes = new Array(
          523.25, 659.25, 783.99, 1046.5, 1318.5
        );
        const now = audioCtx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(
            freq * pitch, now + idx * 0.04
          );
          gain.gain.setValueAtTime(
            0.001, now + idx * 0.04
          );
          gain.gain.exponentialRampToValueAtTime(
            0.055, now + idx * 0.04 + 0.03
          );
          gain.gain.exponentialRampToValueAtTime(
            0.0001, now + idx * 0.04 + 1.0
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          if (audioDest) gain.connect(audioDest);
          osc.start(now + idx * 0.04);
          osc.stop(now + idx * 0.04 + 1.05);
        });
      } catch (e) {}
    }
    let mediaRecorder = null;
    let recordedChunks = new Array();
    let isRecording = false;
    let recTimer = null;

    const recordBtn = document.getElementById('recordBtn');
    const uiPanel = document.getElementById('uiPanel');

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
        return;
      }
      try {
        initAudio();
        const canvasStream = canvas.captureStream(30);
        const tracks = [...canvasStream.getVideoTracks()];
        if (audioDest) {
          tracks.push(...audioDest.stream.getAudioTracks());
        }
        const combinedStream = new MediaStream(tracks);

        const mimeOptions = new Array(
          'video/mp4',
          'video/webm;codecs=vp9,opus',
          'video/webm'
        );
        const mime = mimeOptions.find(
          m => MediaRecorder.isTypeSupported(m)
        ) || '';

        mediaRecorder = mime
          ? new MediaRecorder(combinedStream, {
              mimeType: mime,
              videoBitsPerSecond: 5000000
            })
          : new MediaRecorder(combinedStream);

        recordedChunks = new Array();
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const isMp4 = mime.includes('mp4');
          const ext = isMp4 ? 'mp4' : 'webm';
          const blob = new Blob(recordedChunks, {
            type: mime || 'video/webm'
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Feliz-Navidad-Cobroactivo.${ext}`;
          a.click();
          URL.revokeObjectURL(url);
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = '⏹️ Detener (0s)';
        recordBtn.classList.add('recording');
        uiPanel.classList.add('hidden-rec');

        triggerShockwave(true);
        summonElf();

        let secs = 0;
        recTimer = setInterval(() => {
          secs++;
          recordBtn.textContent = `⏹️ Detener (${secs}s)`;
          if (secs >= 20) stopRecording();
        }, 1000);
      } catch (err) {
        alert('Tu navegador no permite grabar directo.');
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      clearInterval(recTimer);
      recordBtn.textContent = '🎥 Grabar Video';
      recordBtn.classList.remove('recording');
      uiPanel.classList.remove('hidden-rec');
      if (mediaRecorder &&
          mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    recordBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleRecording();
    });
    const THEMES = {
      imperial: {
        bgTop: '#13254c', bgMid: '#050a18', bgBot: '#020308',
        t1: '#fff6d6', t2: '#ffd700', t3: '#ff9900',
        colors: new Array(
          '#00ff95', '#ffd000', '#ff2a5f', '#ffffff'
        ),
        aura: 'rgba(255, 200, 40, 0.12)',
        aurora1: 'rgba(0, 255, 149, 0.08)',
        aurora2: 'rgba(255, 208, 0, 0.07)',
        mountain: '#070f22',
        gifts: new Array(
          { box: '#c81d4e', side: '#8f1135',
            top: '#ea3568', ribbon: '#ffd700' },
          { box: '#0d47a1', side: '#072a63',
            top: '#1976d2', ribbon: '#ffffff' },
          { box: '#00897b', side: '#00564d',
            top: '#26a69a', ribbon: '#ffd000' }
        )
      },
      cyberpunk: {
        bgTop: '#24094a', bgMid: '#090216', bgBot: '#020006',
        t1: '#ffffff', t2: '#00f0ff', t3: '#ff007f',
        colors: new Array(
          '#00f0ff', '#ff007f', '#b5179e', '#ffffff'
        ),
        aura: 'rgba(0, 240, 255, 0.12)',
        aurora1: 'rgba(0, 240, 255, 0.09)',
        aurora2: 'rgba(255, 0, 127, 0.08)',
        mountain: '#0d041d',
        gifts: new Array(
          { box: '#b5179e', side: '#7209b7',
            top: '#f72585', ribbon: '#00f0ff' },
          { box: '#0077b6', side: '#03045e',
            top: '#00b4d8', ribbon: '#ff007f' },
          { box: '#3a0ca3', side: '#240046',
            top: '#7209b7', ribbon: '#ffffff' }
        )
      },
      aurora: {
        bgTop: '#083346', bgMid: '#02111a', bgBot: '#010508',
        t1: '#ffffff', t2: '#00ffd5', t3: '#38b6ff',
        colors: new Array(
          '#00ffd5', '#38b6ff', '#a8ff78', '#ffffff'
        ),
        aura: 'rgba(0, 255, 213, 0.12)',
        aurora1: 'rgba(0, 255, 213, 0.1)',
        aurora2: 'rgba(168, 255, 120, 0.07)',
        mountain: '#03151f',
        gifts: new Array(
          { box: '#007f5f', side: '#004b23',
            top: '#2b9348', ribbon: '#a8ff78' },
          { box: '#0077b6', side: '#023e8a',
            top: '#0096c7', ribbon: '#ffffff' },
          { box: '#009688', side: '#004d40',
            top: '#4db6ac', ribbon: '#00ffd5' }
        )
      }
    };
    let currentTheme = THEMES.imperial;
    const TREE_H = 400;
    const BASE_R = 165;
    const TOTAL_P = 2600;

    const bgStars = Array.from({ length: 160 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.72,
      r: 0.6 + Math.random() * 1.7,
      phase: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 3
    }));

    const bokehLights = Array.from({ length: 24 }, () => ({
      x: Math.random(),
      y: 0.15 + Math.random() * 0.75,
      r: 18 + Math.random() * 42,
      vx: (Math.random() - 0.5) * 0.00025,
      vy: -0.0001 - Math.random() * 0.0002,
      colorIdx: Math.floor(Math.random() * 3),
      phase: Math.random() * Math.PI * 2
    }));

    const santaSleigh = {
      x: -320, baseY: 0.25, speed: 1.45
    };
    const santaSparkles = new Array();

    const elf = {
      active: true, x: -140, targetX: -205,
      state: 'walkIn', timer: 0,
      hasGift: true, dir: 1, cooldown: 0
    };

    function summonElf() {
      const fromLeft = Math.random() < 0.5;
      elf.active = true;
      elf.dir = fromLeft ? 1 : -1;
      elf.x = fromLeft ? -W * 0.55 : W * 0.55;
      elf.targetX = fromLeft ? -205 : 205;
      elf.state = 'walkIn';
      elf.timer = 0;
      elf.hasGift = true;
    }

    const gifts = new Array();
    for (let i = 0; i < 9; i++) {
      gifts.push({
        angle: (i / 9) * Math.PI * 2 + 0.3,
        dist: BASE_R * (0.62 + (i % 3) * 0.22),
        w: 25 + (i % 3) * 8,
        h: 21 + ((i + 1) % 3) * 8,
        d: 23 + ((i + 2) % 3) * 7,
        styleIdx: i % 3
      });
    }
    const particles = new Array();
    for (let i = 0; i < TOTAL_P; i++) {
      const t = i / TOTAL_P;
      const y = (t - 0.5) * TREE_H;
      const maxR = BASE_R * (1 - Math.pow(t, 0.86));
      const isRibbon = i % 4 === 0;
      const r = isRibbon
        ? maxR * 1.05
        : maxR * Math.sqrt(Math.random());
      const angle = isRibbon
        ? t * Math.PI * 16 + (i % 3) * 2.094
        : i * 2.39996;
      const colorIdx = isRibbon
        ? (i % 3)
        : (Math.random() < 0.58
            ? 0 : (Math.random() < 0.82 ? 1 : 2));
      particles.push({
        baseY: y, baseR: r, angle: angle,
        size: isRibbon ? 2.7 : (1.1 + Math.random() * 2.3),
        colorIdx: colorIdx,
        phase: Math.random() * Math.PI * 2,
        isOrnament: !isRibbon && Math.random() < 0.045,
        sparkSpeed: 1.5 + Math.random() * 2.5,
        isExtraLight: false
      });
    }

    let extraLightsAdded = 0;
    const lightCountEl = document.getElementById('lightCount');

    function addMoreFairyLights(batch = 40) {
      if (extraLightsAdded >= 400) {
        particles.length = TOTAL_P;
        extraLightsAdded = 0;
      }
      for (let i = 0; i < batch; i++) {
        const t = 0.04 + Math.random() * 0.92;
        const y = (t - 0.5) * TREE_H;
        const maxR = BASE_R * (1 - Math.pow(t, 0.86));
        particles.push({
          baseY: y,
          baseR: maxR * (0.85 + Math.random() * 0.24),
          angle: Math.random() * Math.PI * 2,
          size: 2.6 + Math.random() * 1.4,
          colorIdx: Math.floor(Math.random() * 4),
          phase: Math.random() * Math.PI * 2,
          isOrnament: true,
          sparkSpeed: 3.0 + Math.random() * 3.5,
          isExtraLight: true
        });
      }
      extraLightsAdded += batch;
      lightCountEl.textContent = extraLightsAdded;
      shockwaveY = TREE_H * 0.52;
      shockwaveActive = true;
      playMagicChime(1.15);
    }
    const snow = Array.from({ length: 320 }, () => ({
      x: (Math.random() - 0.5) * 1600,
      y: (Math.random() - 0.5) * 1000,
      z: (Math.random() - 0.5) * 1000,
      speed: 0.7 + Math.random() * 1.9,
      size: 1.2 + Math.random() * 3.2
    }));

    const bursts = new Array();
    const cursorTrail = new Array();

    function spawnFirework(x, y, z, count = 75) {
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = 2.5 + Math.random() * 6.5;
        const cIdx = Math.floor(Math.random() * 4);
        bursts.push({
          x: x, y: y, z: z,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed - 1.2,
          vz: Math.sin(phi) * Math.sin(theta) * speed,
          life: 1.0,
          decay: 0.014 + Math.random() * 0.015,
          color: currentTheme.colors.at(cIdx),
          size: 1.8 + Math.random() * 2.5
        });
      }
    }

    let rotY = 0, rotVelocity = 0.007;
    let isDragging = false, lastX = 0;
    let mouseX = -9999, mouseY = -9999;
    let targetTiltX = 0, currentTiltX = 0;
    let shockwaveY = 9999, shockwaveActive = false;

    function triggerShockwave(withSound = true) {
      shockwaveY = TREE_H * 0.52;
      shockwaveActive = true;
      spawnFirework(0, -TREE_H * 0.54, 0, 65);
      if (withSound) playMagicChime(1);
    }

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      triggerShockwave(true);
    });

    window.addEventListener('pointermove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      targetTiltX = ((e.clientY / H) - 0.5) * 0.25;
      for (let i = 0; i < 2; i++) {
        const cIdx = Math.floor(Math.random() * 3);
        cursorTrail.push({
          x: e.clientX + (Math.random() - 0.5) * 10,
          y: e.clientY + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2 - 0.5,
          life: 1.0,
          color: currentTheme.colors.at(cIdx),
          size: 1.5 + Math.random() * 2.2
        });
      }
      if (isDragging) {
        const delta = (e.clientX - lastX) * 0.008;
        rotY += delta;
        rotVelocity = delta;
        lastX = e.clientX;
      }
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });
    document.getElementById('addLightsBtn')
      .addEventListener('click', (e) => {
        e.stopPropagation(); addMoreFairyLights(40);
      });
    document.getElementById('elfBtn')
      .addEventListener('click', (e) => {
        e.stopPropagation();
        summonElf();
        playMagicChime(1.25);
      });
    document.getElementById('fireworkBtn')
      .addEventListener('click', (e) => {
        e.stopPropagation();
        triggerShockwave(true);
        spawnFirework(
          (Math.random() - 0.5) * 180,
          -120,
          (Math.random() - 0.5) * 120, 85
        );
      });
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled
        ? '🔊 Sonido' : '🔇 Silencio';
      if (soundEnabled) playMagicChime(1);
    });
    document.querySelectorAll('.theme-btn')
      .forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.theme-btn')
            .forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTheme = THEMES[btn.dataset.theme];
          triggerShockwave(true);
        });
      });

    summonElf();
    function drawBrandHeaderCanvas() {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      const badgeH = Math.max(42, Math.min(56, H * 0.07));
      const badgeW = badgeH * 4.75;
      const bx = W * 0.5 - badgeW * 0.5;
      const by = 16;

      ctx.shadowColor = 'rgba(0, 180, 255, 0.45)';
      ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.beginPath();
      ctx.roundRect(bx, by, badgeW, badgeH, badgeH * 0.5);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      const padX = badgeW * 0.055;
      const padY = badgeH * 0.08;
      const innerW = badgeW - padX * 2;
      const innerH = badgeH - padY * 2;
      const scaleLogo = Math.min(innerW / 430, innerH / 92);

      ctx.translate(
        bx + badgeW * 0.5 - (430 * scaleLogo) * 0.5,
        by + badgeH * 0.5 - (92 * scaleLogo) * 0.5
      );
      ctx.scale(scaleLogo, scaleLogo);

      ctx.fillStyle = '#073262';
      ctx.fill(logoPathBlue);
      ctx.fillStyle = '#7D8082';
      ctx.fill(logoPathGray);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#073262';
      ctx.font = '800 47px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Cobro', 106, 61);
      const cobroW = ctx.measureText('Cobro').width;
      ctx.font = '300 47px "Segoe UI", Arial, sans-serif';
      ctx.fillText('activo', 106 + cobroW, 61);

      ctx.fillStyle = '#6D7072';
      ctx.font = '400 18.5px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Salvamos Recursos', 234, 83);
      ctx.restore();

      const fontSize = Math.max(
        18, Math.min(44, W * 0.036)
      );
      const titleY = by + badgeH + fontSize + 10;
      ctx.font = `900 ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      const textGrad = ctx.createLinearGradient(
        W * 0.25, titleY - fontSize,
        W * 0.75, titleY
      );
      textGrad.addColorStop(0, currentTheme.t1);
      textGrad.addColorStop(0.5, currentTheme.t2);
      textGrad.addColorStop(1, currentTheme.t3);

      ctx.shadowColor = 'rgba(255, 190, 50, 0.85)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = textGrad;
      ctx.fillText(
        '¡FELIZ NAVIDAD COBROACTIVO!',
        W * 0.5, titleY
      );
      ctx.restore();
    }
    function project(x, y, z) {
      const cosT = Math.cos(currentTiltX);
      const sinT = Math.sin(currentTiltX);
      const ry = y * cosT - z * sinT;
      const rz = y * sinT + z * cosT;
      const fov = 700;
      const scale = fov / (fov + rz + 490);
      return {
        x: W * 0.5 + x * scale,
        y: H * 0.57 + ry * scale,
        scale: scale,
        z: rz
      };
    }

    function drawSantaAndReindeer(time) {
      santaSleigh.x += santaSleigh.speed;
      if (santaSleigh.x > W + 340) santaSleigh.x = -340;
      const sx = santaSleigh.x;
      const sy = H * santaSleigh.baseY +
                 Math.sin(time * 2.1) * 14;
      const sc = Math.max(0.65, Math.min(1.05, W / 1280));

      for (let i = 0; i < 3; i++) {
        santaSparkles.push({
          x: sx - 62 * sc + (Math.random() - 0.5) * 16,
          y: sy + 8 * sc + (Math.random() - 0.5) * 16,
          vx: -0.7 - Math.random() * 0.9,
          vy: (Math.random() - 0.5) * 0.8,
          life: 1.0,
          size: (1.6 + Math.random() * 2.4) * sc
        });
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = santaSparkles.length - 1; i >= 0; i--) {
        const sp = santaSparkles.at(i);
        sp.x += sp.vx; sp.y += sp.vy; sp.life -= 0.02;
        if (sp.life <= 0) {
          santaSparkles.splice(i, 1); continue;
        }
        ctx.globalAlpha = sp.life * 0.9;
        ctx.fillStyle = i % 2 === 0 ? '#ffd700' : '#ffffff';
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.translate(sx, sy);
      ctx.scale(sc, sc);

    function drawScenicBackdrop(time) {

    function drawGift3D(g, floorY) {
      const a = g.angle + rotY;
      const cx = Math.cos(a) * g.dist;
      const cz = Math.sin(a) * g.dist;
      const cy = floorY - g.h * 0.5;
      const proj = project(cx, cy, cz);
      if (proj.scale <= 0) return null;
      return {
        z: proj.z,
        draw: () => {
          const s = proj.scale;
          const w = g.w * s, h = g.h * s;
          const d = g.d * 0.45 * s;
          const x = proj.x - w * 0.5, y = proj.y - h * 0.5;
          const pal = currentTheme.gifts.at(g.styleIdx);
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 0.96;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';

            proj.x + d * 0.3, y + h + 2 * s,
            w * 0.72, d * 0.6, 0, 0, Math.PI * 2

          ctx.fillRect(x, y, w, h);
          ctx.fillStyle = pal.side;
          ctx.beginPath();
          ctx.moveTo(x + w, y);
          ctx.lineTo(x + w + d, y - d * 0.65);
          ctx.lineTo(x + w + d, y + h - d * 0.65);
          ctx.lineTo(x + w, y + h);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = pal.top;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + d, y - d * 0.65);
          ctx.lineTo(x + w + d, y - d * 0.65);
          ctx.lineTo(x + w, y);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = pal.ribbon;
          const rw = Math.max(2, w * 0.18);
          ctx.fillRect(x + w * 0.5 - rw * 0.5, y, rw, h);
          ctx.beginPath();
          ctx.moveTo(x + w * 0.5 - rw * 0.5, y);
          ctx.lineTo(
            x + d + w * 0.5 - rw * 0.5, y - d * 0.65
          );
          ctx.lineTo(
            x + d + w * 0.5 + rw * 0.5, y - d * 0.65
          );
          ctx.lineTo(x + w * 0.5 + rw * 0.5, y);
          ctx.closePath(); ctx.fill();
          const bx = x + w * 0.5 + d * 0.5;
          const by = y - d * 0.32;
          ctx.strokeStyle = pal.ribbon;
          ctx.lineWidth = Math.max(1.5, 2.2 * s);
          ctx.beginPath();
          ctx.ellipse(
            bx - 4 * s, by - 2 * s,
            5 * s, 2.8 * s, -0.4, 0, Math.PI * 2

            5 * s, 2.8 * s, 0.4, 0, Math.PI * 2
          );
          ctx.stroke();
          ctx.restore();
        }

    function drawStarShape(cx, cy, spk, outR, inR, rot) {

        const r = i % 2 === 0 ? outR : inR;
        const a = (i * Math.PI) / spk + rot;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

            Math.abs(y - shockwaveY) < 50) {

          item.x, item.y,

      starGrad.addColorStop(0, '#ffffff');
      starGrad.addColorStop(0.25, c1);
      starGrad.addColorStop(0.6, c2);
      starGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = starGrad;
      ctx.beginPath();
      ctx.arc(
        topProj.x, topProj.y,
        54 * topProj.scale, 0, Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.95;
      drawStarShape(
        topProj.x, topProj.y, 8,
        22 * topProj.scale, 4 * topProj.scale, time * 0.8
      );
      ctx.fill();
      ctx.fillStyle = c1;
      ctx.globalAlpha = 0.78;
      drawStarShape(
        topProj.x, topProj.y, 4,
        29 * topProj.scale, 3 * topProj.scale, -time * 1.1
      );
      ctx.fill();

      for (let i = cursorTrail.length - 1; i >= 0; i--) {
        const ct = cursorTrail.at(i);
        ct.x += ct.vx; ct.y += ct.vy;
        ct.life -= 0.035;
        if (ct.life <= 0) {
          cursorTrail.splice(i, 1); continue;
        }
        ctx.globalAlpha = ct.life * 0.8;
        ctx.fillStyle = ct.color;
        ctx.beginPath();
        ctx.arc(
          ct.x, ct.y,
          ct.size * ct.life, 0, Math.PI * 2
        );
        ctx.fill();
      }

      drawBrandHeaderCanvas();
    }
    draw();
  </script>
</body>
</html>
